[workspace]
members = ["crates/mason-core", "crates/mason-android", "crates/mason-ios", "crates/mason-playground", "crates/mason-c", "crates/mason-windows", "crates/taffy"]
resolver = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
debug = false
incremental = false
strip = true
debug-assertions = false
overflow-checks = false

[workspace.dependencies]
# Vendored from triniwiz/taffy rev 8a6ebeda (branch mason-fixes-v2): taffy
# 0.14 plus flexbox and out-of-flow sizing fixes not yet upstream. Vendored
# so layout probes can be instrumented; keep in sync with the fork.
taffy = { path = "crates/taffy" }
style_atoms = { git = "https://github.com/servo/stylo", rev = "85ae0b1", package = "stylo_atoms" }
